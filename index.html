    let pickup = document.getElementById("farePickup").value;
    let drop = document.getElementById("fareDrop").value;
    let tripType = document.getElementById("fareTripType").value;
    let vehicle = document.getElementById("fareVehicle").value;
    let date = document.getElementById("fareDate").value;
    let time = document.getElementById("fareTime").value;
    let passengers = document.getElementById("passengers").value;

    let message = `🚕 Shivam Travels - Best Fare Request

📍 Pickup: ${pickup}
🏁 Drop: ${drop}

🛣️ Trip Type: ${tripType}
🚖 Vehicle: ${vehicle}

📅 Date: ${date}
⏰ Time: ${time}

👥 Passengers: ${passengers}`;

    let whatsappURL =
    "https://wa.me/919898222313?text=" +
    encodeURIComponent(message);

    window.open(whatsappURL, "_blank");

}
